# Netlify builds the static export and serves it directly. No Next runtime,
# no functions — the app has no server side to run.
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"

# Next writes each route as its own HTML file, so the only thing left for the
# host to decide is what happens on an unknown path.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
